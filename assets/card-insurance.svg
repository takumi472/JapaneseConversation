<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 152" role="img" aria-label="健康保険証の見本イラスト">
  <defs>
    <linearGradient id="hiBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ECFDF5"/>
      <stop offset="55%" stop-color="#F0FDF4"/>
      <stop offset="100%" stop-color="#D1FAE5"/>
    </linearGradient>
  </defs>
  <!-- Card base -->
  <rect x="2" y="2" width="236" height="148" rx="12" fill="url(#hiBg)" stroke="#6EE7B7" stroke-width="2"/>
  <!-- Top header bar -->
  <path d="M14 2 H226 A12 12 0 0 1 238 14 V31 H2 V14 A12 12 0 0 1 14 2 Z" fill="#059669"/>
  <text x="14" y="20" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#FFFFFF">健康保険証（ほけんしょう）</text>

  <!-- Medical cross icon -->
  <rect x="206" y="7" width="18" height="18" rx="4" fill="#FFFFFF"/>
  <rect x="213" y="10" width="4" height="12" rx="1" fill="#059669"/>
  <rect x="209" y="14" width="12" height="4" rx="1" fill="#059669"/>

  <!-- Card info rows -->
  <text x="14" y="47" font-family="sans-serif" font-size="7.2" fill="#065F46">記号・番号</text>
  <rect x="58" y="40" width="90" height="8" rx="2" fill="#A7F3D0"/>

  <text x="14" y="66" font-family="sans-serif" font-size="7.2" fill="#065F46">氏名</text>
  <text x="58" y="67" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#0F172A">にほん たろう</text>

  <text x="14" y="84" font-family="sans-serif" font-size="7.2" fill="#065F46">生年月日</text>
  <rect x="58" y="77" width="84" height="7" rx="2" fill="#CBD5E1"/>

  <!-- 30% highlight box -->
  <rect x="14" y="96" width="150" height="38" rx="8" fill="#FFFFFF" stroke="#34D399" stroke-width="1.5"/>
  <text x="24" y="111" font-family="sans-serif" font-size="7.5" font-weight="700" fill="#065F46">びょういんの おかね</text>
  <text x="24" y="127" font-family="sans-serif" font-size="12.5" font-weight="800" fill="#DC2626">3わり (30%)</text>

  <!-- Official red stamp -->
  <rect x="184" y="94" width="38" height="38" rx="5" fill="#FEF2F2" stroke="#EF4444" stroke-width="2"/>
  <text x="203" y="118" text-anchor="middle" font-family="serif" font-size="14" font-weight="700" fill="#DC2626">保険</text>

  <!-- Sample badge -->
  <rect x="178" y="42" width="46" height="16" rx="4" fill="#D1FAE5" stroke="#10B981" stroke-width="1"/>
  <text x="201" y="53" text-anchor="middle" font-family="sans-serif" font-size="8" font-weight="700" fill="#047857">みほん</text>
</svg>
