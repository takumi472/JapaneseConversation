<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 152" role="img" aria-label="在留カードの見本イラスト">
  <defs>
    <linearGradient id="rcBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F0F9FF"/>
      <stop offset="55%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E0F2FE"/>
    </linearGradient>
  </defs>
  <!-- Card base -->
  <rect x="2" y="2" width="236" height="148" rx="12" fill="url(#rcBg)" stroke="#93C5FD" stroke-width="2"/>
  <!-- Top header bar -->
  <path d="M14 2 H226 A12 12 0 0 1 238 14 V32 H2 V14 A12 12 0 0 1 14 2 Z" fill="#1D4ED8"/>
  <text x="14" y="16" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#FFFFFF">在留カード</text>
  <text x="14" y="27" font-family="sans-serif" font-size="7.2" font-weight="600" fill="#BFDBFE">RESIDENCE CARD</text>
  <text x="224" y="21" text-anchor="end" font-family="monospace" font-size="8" font-weight="700" fill="#E0F2FE">AB12345678CD</text>

  <!-- Subtle sakura motif -->
  <circle cx="136" cy="126" r="14" fill="#FBCFE8" opacity="0.35"/>
  <circle cx="152" cy="116" r="9" fill="#F9A8D4" opacity="0.3"/>

  <!-- Left text fields -->
  <text x="14" y="47" font-family="sans-serif" font-size="6.8" fill="#64748B">氏名 NAME</text>
  <text x="14" y="59" font-family="sans-serif" font-size="10" font-weight="700" fill="#0F172A">SAMPLE TARO</text>

  <text x="14" y="73" font-family="sans-serif" font-size="6.8" fill="#64748B">住居地 ADDRESS</text>
  <rect x="14" y="77" width="136" height="6" rx="2" fill="#CBD5E1"/>

  <text x="14" y="96" font-family="sans-serif" font-size="6.8" fill="#64748B">在留資格 STATUS</text>
  <rect x="14" y="100" width="110" height="7" rx="2" fill="#93C5FD"/>

  <text x="14" y="121" font-family="sans-serif" font-size="6.8" fill="#64748B">有効期限 VALID UNTIL</text>
  <text x="14" y="133" font-family="sans-serif" font-size="8.5" font-weight="700" fill="#1E3A8A">2028年 04月 01日</text>

  <!-- Photo box -->
  <rect x="166" y="42" width="58" height="74" rx="6" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
  <circle cx="195" cy="68" r="13" fill="#64748B"/>
  <path d="M174 110 C174 94, 216 94, 216 110 Z" fill="#64748B"/>

  <!-- Sample badge -->
  <rect x="172" y="123" width="46" height="16" rx="4" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1"/>
  <text x="195" y="134" text-anchor="middle" font-family="sans-serif" font-size="8" font-weight="700" fill="#1D4ED8">みほん</text>
</svg>
