<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 120" role="img" aria-label="しょうぼうしゃ（消防車）のイラスト">
  <rect width="180" height="120" rx="14" fill="#FFF7ED"/>
  <!-- Road -->
  <rect x="10" y="96" width="160" height="6" rx="3" fill="#CBD5E1"/>
  <!-- Siren glow -->
  <path d="M126 19 L122 12 M134 17 L134 10 M142 19 L146 12" stroke="#EF4444" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Siren light -->
  <rect x="125" y="22" width="18" height="8" rx="4" fill="#DC2626"/>
  <rect x="130" y="24" width="8" height="3.5" rx="1.5" fill="#FCA5A5"/>
  <!-- Ladder on top -->
  <rect x="24" y="24" width="88" height="12" rx="3" fill="#E2E8F0" stroke="#64748B" stroke-width="2"/>
  <line x1="36" y1="24" x2="36" y2="36" stroke="#64748B" stroke-width="2.5"/>
  <line x1="50" y1="24" x2="50" y2="36" stroke="#64748B" stroke-width="2.5"/>
  <line x1="64" y1="24" x2="64" y2="36" stroke="#64748B" stroke-width="2.5"/>
  <line x1="78" y1="24" x2="78" y2="36" stroke="#64748B" stroke-width="2.5"/>
  <line x1="92" y1="24" x2="92" y2="36" stroke="#64748B" stroke-width="2.5"/>
  <line x1="104" y1="24" x2="104" y2="36" stroke="#64748B" stroke-width="2.5"/>
  <!-- Main red truck body -->
  <rect x="22" y="38" width="94" height="54" rx="5" fill="#DC2626" stroke="#991B1B" stroke-width="2.5"/>
  <!-- Cab -->
  <path d="M114 31 L144 31 C150 31, 154 35, 156 42 L159 64 L159 87 C159 90, 156 92, 153 92 L114 92 Z" fill="#DC2626" stroke="#991B1B" stroke-width="2.5"/>
  <!-- Cab window -->
  <path d="M122 38 L143 38 C147 38, 149 41, 150 45 L152 58 L122 58 Z" fill="#BAE6FD" stroke="#64748B" stroke-width="2"/>
  <!-- Equipment shutter -->
  <rect x="32" y="48" width="44" height="32" rx="3" fill="#F1F5F9" stroke="#64748B" stroke-width="2"/>
  <line x1="34" y1="56" x2="74" y2="56" stroke="#94A3B8" stroke-width="2"/>
  <line x1="34" y1="64" x2="74" y2="64" stroke="#94A3B8" stroke-width="2"/>
  <line x1="34" y1="72" x2="74" y2="72" stroke="#94A3B8" stroke-width="2"/>
  <!-- Hose reel -->
  <circle cx="95" cy="64" r="12" fill="#FEF3C7" stroke="#991B1B" stroke-width="2.5"/>
  <circle cx="95" cy="64" r="5" fill="#991B1B"/>
  <!-- Headlight -->
  <rect x="151" y="70" width="7" height="8" rx="2" fill="#FDE047"/>
  <!-- Wheels -->
  <circle cx="52" cy="92" r="13" fill="#1E293B"/>
  <circle cx="52" cy="92" r="6" fill="#CBD5E1"/>
  <circle cx="132" cy="92" r="13" fill="#1E293B"/>
  <circle cx="132" cy="92" r="6" fill="#CBD5E1"/>
</svg>
