<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 152" role="img" aria-label="マイナンバーカードの見本イラスト">
  <defs>
    <linearGradient id="mnBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF1F2"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E0F2FE"/>
    </linearGradient>
  </defs>
  <!-- Card base -->
  <rect x="2" y="2" width="236" height="148" rx="12" fill="url(#mnBg)" stroke="#F9A8D4" stroke-width="2"/>
  <!-- Top header accent -->
  <path d="M14 2 H226 A12 12 0 0 1 238 14 V30 H2 V14 A12 12 0 0 1 14 2 Z" fill="#EC4899" opacity="0.9"/>
  <text x="14" y="19" font-family="sans-serif" font-size="10" font-weight="700" fill="#FFFFFF">マイナンバーカード</text>
  <text x="224" y="19" text-anchor="end" font-family="sans-serif" font-size="7.2" font-weight="600" fill="#FCE7F3">MY NUMBER CARD</text>

  <!-- Sakura petals background -->
  <circle cx="204" cy="120" r="16" fill="#FBCFE8" opacity="0.45"/>
  <circle cx="184" cy="130" r="10" fill="#BAE6FD" opacity="0.5"/>

  <!-- Photo box on left (like actual Japanese My Number Card) -->
  <rect x="14" y="42" width="52" height="66" rx="6" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
  <circle cx="40" cy="64" r="11.5" fill="#64748B"/>
  <path d="M21 102 C21 88, 59 88, 59 102 Z" fill="#64748B"/>

  <!-- Gold IC chip icon -->
  <rect x="14" y="116" width="26" height="20" rx="4" fill="#FBBF24" stroke="#B45309" stroke-width="1.2"/>
  <line x1="14" y1="126" x2="40" y2="126" stroke="#B45309" stroke-width="1"/>
  <line x1="27" y1="116" x2="27" y2="136" stroke="#B45309" stroke-width="1"/>

  <!-- Right info fields -->
  <text x="78" y="51" font-family="sans-serif" font-size="7" fill="#64748B">氏名</text>
  <text x="78" y="64" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#0F172A">にほん はなこ</text>

  <text x="78" y="79" font-family="sans-serif" font-size="7" fill="#64748B">住所</text>
  <rect x="78" y="84" width="140" height="6.5" rx="2" fill="#CBD5E1"/>

  <text x="78" y="104" font-family="sans-serif" font-size="7" fill="#64748B">マイナ保険証にも つかえます</text>
  <rect x="78" y="110" width="96" height="18" rx="5" fill="#EFF6FF" stroke="#60A5FA" stroke-width="1"/>
  <text x="126" y="122" text-anchor="middle" font-family="sans-serif" font-size="7.8" font-weight="700" fill="#1D4ED8">マイナ保険証 OK</text>

  <!-- Sample badge -->
  <rect x="180" y="112" width="44" height="16" rx="4" fill="#FCE7F3" stroke="#EC4899" stroke-width="1"/>
  <text x="202" y="123" text-anchor="middle" font-family="sans-serif" font-size="8" font-weight="700" fill="#BE185D">みほん</text>
</svg>
